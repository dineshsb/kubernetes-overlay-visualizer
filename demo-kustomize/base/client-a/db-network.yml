apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db-network-policy
spec:
  podSelector:
    matchLabels:
      client: client-a
  policyTypes:
  - Egress
  egress:
  # Allow access to PostgreSQL database
  - to:
    - namespaceSelector:
        matchLabels:
          name: database
    - podSelector:
        matchLabels:
          app: postgresql
    - ipBlock:
        cidr: 10.100.1.0/24
    ports:
    - protocol: TCP
      port: 5432
  # Allow access to Redis cache
  - to:
    - podSelector:
        matchLabels:
          app: redis
    - ipBlock:
        cidr: 10.100.2.0/24
    ports:
    - protocol: TCP
      port: 6379
  # DNS access
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
    - ipBlock:
        cidr: 10.96.0.10/32
    ports:
    - protocol: UDP
      port: 53
