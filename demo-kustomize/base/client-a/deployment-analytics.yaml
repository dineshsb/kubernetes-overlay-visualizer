apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics
  labels:
    app: analytics
    tier: analytics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics
  template:
    metadata:
      labels:
        app: analytics
        tier: analytics
    spec:
      containers:
      - name: analytics
        image: nginx:1.21-alpine
        envFrom:
        - configMapRef:
            name: common-config
        - configMapRef:
            name: client-config
        env:
        - name: SERVICE_NAME
          value: "analytics"
        - name: ANALYTICS_ENGINE
          value: "spark"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
      # Logging Sidecar
      - name: fluentd-sidecar
        image: fluent/fluentd:v1.14
        env:
        - name: FLUENTD_CONF
          value: "fluentd.conf"
        - name: LOG_SOURCE
          value: "/var/log/analytics"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        volumeMounts:
        - name: log-volume
          mountPath: /var/log/analytics
      # Service Mesh Sidecar
      - name: envoy-proxy
        image: envoyproxy/envoy:v1.24.0
        ports:
        - containerPort: 15001
          name: proxy
        env:
        - name: SERVICE_NAME
          value: "analytics"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
      volumes:
      - name: log-volume
        emptyDir: {}
