apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Inherit from common base
bases:
- ../

# Client A specific resources
resources:
- db-network.yml

namePrefix: client-a-

commonLabels:
  client: client-a
  team: platform-team
  
# Client A uses specific database configuration
configMapGenerator:
- name: client-config
  literals:
  - CLIENT_ID=client-a
  - TENANT=client-a
  - DATABASE_TYPE=postgresql
  - CACHE_ENABLED=true
