apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-network-policy
spec:
  podSelector:
    matchLabels:
      client: client-b
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow API gateway to reach this service
  - from:
    - namespaceSelector:
        matchLabels:
          name: api-gateway
    - ipBlock:
        cidr: 10.200.1.0/24
    ports:
    - protocol: TCP
      port: 8080
  egress:
  # Allow access to MySQL database
  - to:
    - namespaceSelector:
        matchLabels:
          name: database
    - podSelector:
        matchLabels:
          app: mysql
    - ipBlock:
        cidr: 10.100.3.0/24
    ports:
    - protocol: TCP
      port: 3306
  # Allow access to external APIs
  - to:
    - namespaceSelector:
        matchLabels:
          name: external-services
    - ipBlock:
        cidr: 192.168.50.0/24
    ports:
    - protocol: TCP
      port: 443
  # Allow S3 access for Client B
  - to:
    - ipBlock:
        cidr: 52.92.0.0/16  # AWS S3 IP range
    ports:
    - protocol: TCP
      port: 443
  # DNS access
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
    - ipBlock:
        cidr: 10.96.0.10/32
    ports:
    - protocol: UDP
      port: 53
