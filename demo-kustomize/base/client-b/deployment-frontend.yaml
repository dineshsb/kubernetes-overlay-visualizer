apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        tier: frontend
    spec:
      containers:
      - name: frontend
        image: nginx:1.22-alpine
        ports:
        - containerPort: 80
          name: http
        envFrom:
        - configMapRef:
            name: common-config
        - configMapRef:
            name: client-config
        env:
        - name: SERVICE_NAME
          value: "frontend"
        - name: BACKEND_URL
          value: "http://client-b-api:8080"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
      # Logging Sidecar
      - name: fluentd-sidecar
        image: fluent/fluentd:v1.14
        env:
        - name: FLUENTD_CONF
          value: "fluentd.conf"
        - name: LOG_SOURCE
          value: "/var/log/frontend"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        volumeMounts:
        - name: log-volume
          mountPath: /var/log/frontend
      # Service Mesh Sidecar
      - name: envoy-proxy
        image: envoyproxy/envoy:v1.24.0
        ports:
        - containerPort: 15001
          name: proxy
        env:
        - name: SERVICE_NAME
          value: "frontend"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
      volumes:
      - name: log-volume
        emptyDir: {}
