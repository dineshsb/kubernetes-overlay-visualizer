apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Inherit from common base
bases:
- ../

# Client B specific resources
resources:
- api-network.yml

namePrefix: client-b-

commonLabels:
  client: client-b
  team: data-team

# Client B uses API-heavy configuration
configMapGenerator:
- name: client-config
  literals:
  - CLIENT_ID=client-b
  - TENANT=client-b
  - DATABASE_TYPE=mysql
  - EXTERNAL_API_ENABLED=true
  - RATE_LIMIT=1000
