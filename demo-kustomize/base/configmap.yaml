apiVersion: v1
kind: ConfigMap
metadata:
  name: common-config
data:
  # Common environment variables for all workloads
  PLATFORM_NAME: "Multi-Tenant Platform"
  API_VERSION: "v1"
  METRICS_ENABLED: "true"
  METRICS_PORT: "9090"
  HEALTH_CHECK_PATH: "/health"
  READINESS_CHECK_PATH: "/ready"
  LOG_FORMAT: "json"
  TIMEZONE: "UTC"
  ENABLE_TRACING: "true"
  TRACE_SAMPLING_RATE: "0.1"
