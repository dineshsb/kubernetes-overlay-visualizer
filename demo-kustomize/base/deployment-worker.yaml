apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app: worker
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
        tier: backend
    spec:
      containers:
      - name: worker
        image: nginx:1.21
        envFrom:
        - configMapRef:
            name: common-config
        env:
        - name: SERVICE_NAME
          value: "worker"
        - name: QUEUE_NAME
          value: "default"
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "400m"
      # Logging Sidecar
      - name: fluentd-sidecar
        image: fluent/fluentd:v1.14
        env:
        - name: FLUENTD_CONF
          value: "fluentd.conf"
        - name: LOG_SOURCE
          value: "/var/log/worker"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        volumeMounts:
        - name: log-volume
          mountPath: /var/log/worker
      volumes:
      - name: log-volume
        emptyDir: {}
