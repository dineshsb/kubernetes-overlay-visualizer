apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: api
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
        tier: backend
    spec:
      containers:
      - name: api
        image: nginx:1.21
        ports:
        - containerPort: 8080
          name: http
        envFrom:
        - configMapRef:
            name: common-config
        env:
        - name: SERVICE_NAME
          value: "api"
        - name: LOG_LEVEL
          value: "INFO"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
      # Logging Sidecar
      - name: fluentd-sidecar
        image: fluent/fluentd:v1.14
        env:
        - name: FLUENTD_CONF
          value: "fluentd.conf"
        - name: LOG_SOURCE
          value: "/var/log/app"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        volumeMounts:
        - name: log-volume
          mountPath: /var/log/app
      # Metrics Sidecar
      - name: prometheus-exporter
        image: prom/node-exporter:v1.3.1
        ports:
        - containerPort: 9090
          name: metrics
        resources:
          requests:
            memory: "32Mi"
            cpu: "25m"
          limits:
            memory: "64Mi"
            cpu: "50m"
      volumes:
      - name: log-volume
        emptyDir: {}
