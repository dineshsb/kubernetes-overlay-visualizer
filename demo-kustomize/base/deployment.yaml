apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    app: common-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: common-app
  template:
    metadata:
      labels:
        app: common-app
    spec:
      containers:
      - name: app
        image: nginx:1.21
        ports:
        - containerPort: 8080
        env:
        - name: ENVIRONMENT
          value: "base"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
