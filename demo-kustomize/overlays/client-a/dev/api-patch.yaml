apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  template:
    spec:
      containers:
      - name: api
        image: nginx:1.21-alpine
        env:
        - name: ENVIRONMENT
          value: "development"
        - name: DEBUG_ENDPOINTS
          value: "true"
        - name: RATE_LIMIT_DEV
          value: "unlimited"
