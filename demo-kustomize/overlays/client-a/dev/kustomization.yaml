apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Inherit from Client A base
bases:
- ../../../base/client-a

namespace: client-a-dev

commonLabels:
  environment: dev

replicas:
- name: app
  count: 2

patchesStrategicMerge:
- deployment-patch.yaml

configMapGenerator:
- name: env-config
  behavior: merge
  literals:
  - ENVIRONMENT=dev
  - LOG_LEVEL=DEBUG
  - API_ENDPOINT=https://api.client-a.dev.example.com
