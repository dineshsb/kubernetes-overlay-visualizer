apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Inherit from Client A base
bases:
- ../../../base/client-a

commonLabels:
  environment: dev

replicas:
- name: api
  count: 2
- name: worker
  count: 1
- name: analytics
  count: 1

patchesStrategicMerge:
- api-patch.yaml
- worker-patch.yaml

configMapGenerator:
- name: env-config
  literals:
  - ENVIRONMENT=development
  - LOG_LEVEL=DEBUG
  - DEBUG_MODE=true
  - API_ENDPOINT=https://api.client-a.dev.example.com
