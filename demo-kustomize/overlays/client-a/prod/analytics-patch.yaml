apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics
spec:
  template:
    spec:
      containers:
      - name: analytics
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: SPARK_EXECUTORS
          value: "4"
        - name: DATA_RETENTION_DAYS
          value: "90"
        resources:
          requests:
            memory: "1Gi"
            cpu: "1000m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
