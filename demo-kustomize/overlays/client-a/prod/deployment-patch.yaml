apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
spec:
  template:
    spec:
      containers:
      - name: app
        image: nginx:1.21-alpine
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: CLIENT_NAME
          value: "Client A"
        - name: FEATURE_FLAGS
          value: "feature-a,feature-b,feature-c"
        - name: ENABLE_MONITORING
          value: "true"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
