apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Inherit from Client A base
bases:
- ../../../base/client-a

namespace: client-a-prod

commonLabels:
  environment: prod

replicas:
- name: app
  count: 5

patchesStrategicMerge:
- deployment-patch.yaml

configMapGenerator:
- name: env-config
  behavior: merge
  literals:
  - ENVIRONMENT=production
  - LOG_LEVEL=WARN
  - API_ENDPOINT=https://api.client-a.example.com
  - MONITORING_ENABLED=true
