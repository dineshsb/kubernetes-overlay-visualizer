apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Inherit from Client A base
bases:
- ../../../base/client-a

commonLabels:
  environment: prod

replicas:
- name: api
  count: 5
- name: worker
  count: 3
- name: analytics
  count: 2

patchesStrategicMerge:
- api-patch.yaml
- worker-patch.yaml
- analytics-patch.yaml

configMapGenerator:
- name: env-config
  literals:
  - ENVIRONMENT=production
  - LOG_LEVEL=WARN
  - API_ENDPOINT=https://api.client-a.example.com
  - MONITORING_ENABLED=true
