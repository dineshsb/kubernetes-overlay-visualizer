apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Inherit from Client B base
bases:
- ../../../base/client-b

commonLabels:
  environment: dev

replicas:
- name: api
  count: 2
- name: worker
  count: 1
- name: frontend
  count: 2

patchesStrategicMerge:
- api-patch.yaml
- frontend-patch.yaml

configMapGenerator:
- name: env-config
  literals:
  - ENVIRONMENT=development
  - LOG_LEVEL=DEBUG
  - API_ENDPOINT=https://api.client-b.dev.example.com
  - EXTERNAL_API_URL=https://external-dev.api.example.com
