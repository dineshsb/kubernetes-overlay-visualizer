apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Inherit from Client B base
bases:
- ../../../base/client-b

namespace: client-b-dev

commonLabels:
  environment: dev

replicas:
- name: app
  count: 2

patchesStrategicMerge:
- deployment-patch.yaml

configMapGenerator:
- name: env-config
  behavior: merge
  literals:
  - ENVIRONMENT=dev
  - LOG_LEVEL=DEBUG
  - API_ENDPOINT=https://api.client-b.dev.example.com
  - EXTERNAL_API_URL=https://external-dev.api.example.com
