apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Inherit from Client B base
bases:
- ../../../base/client-b

namespace: client-b-prod

commonLabels:
  environment: prod

replicas:
- name: app
  count: 7

patchesStrategicMerge:
- deployment-patch.yaml

configMapGenerator:
- name: env-config
  behavior: merge
  literals:
  - ENVIRONMENT=production
  - LOG_LEVEL=ERROR
  - API_ENDPOINT=https://api.client-b.example.com
  - EXTERNAL_API_URL=https://external.api.example.com
  - MONITORING_ENABLED=true
