apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Inherit from Client B base
bases:
- ../../../base/client-b

commonLabels:
  environment: prod

replicas:
- name: api
  count: 7
- name: worker
  count: 5
- name: frontend
  count: 5

patchesStrategicMerge:
- api-patch.yaml
- worker-patch.yaml
- frontend-patch.yaml

configMapGenerator:
- name: env-config
  literals:
  - ENVIRONMENT=production
  - LOG_LEVEL=ERROR
  - API_ENDPOINT=https://api.client-b.example.com
  - EXTERNAL_API_URL=https://external.api.example.com
  - MONITORING_ENABLED=true
  - CDN_ENABLED=true
