apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  template:
    spec:
      containers:
      - name: app
        image: nginx:1.21-alpine
        env:
        - name: ENVIRONMENT
          value: "dev"
        - name: CLIENT_NAME
          value: "Client A"
        - name: FEATURE_FLAGS
          value: "feature-a,feature-b"
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
