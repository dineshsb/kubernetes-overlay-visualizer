apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

bases:
- ../../../base

namePrefix: dev-client-a-

namespace: client-a-dev

commonLabels:
  client: client-a
  environment: dev

replicas:
- name: app
  count: 3

resources:
- network-policy.yaml

patchesStrategicMerge:
- deployment-patch.yaml

configMapGenerator:
- name: client-config
  literals:
  - CLIENT_ID=client-a
  - TENANT=client-a
  - API_ENDPOINT=https://api.client-a.dev.example.com
