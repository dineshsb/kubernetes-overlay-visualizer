apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

bases:
- ../../../base

namePrefix: dev-client-b-

namespace: client-b-dev

commonLabels:
  client: client-b
  environment: dev

replicas:
- name: app
  count: 2

resources:
- network-policy.yaml

patchesStrategicMerge:
- deployment-patch.yaml

configMapGenerator:
- name: client-config
  literals:
  - CLIENT_ID=client-b
  - TENANT=client-b
  - API_ENDPOINT=https://api.client-b.dev.example.com
