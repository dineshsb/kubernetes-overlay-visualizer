apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: client-b-network-policy
spec:
  podSelector:
    matchLabels:
      client: client-b
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    - podSelector:
        matchLabels:
          app: client-b-frontend
    ports:
    - protocol: TCP
      port: 8080
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: database
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - namespaceSelector:
        matchLabels:
          name: external-apis
    ports:
    - protocol: TCP
      port: 443
  # Allow DNS
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
    ports:
    - protocol: UDP
      port: 53
  # Client B also needs access to S3
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443
