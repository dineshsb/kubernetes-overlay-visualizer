apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

bases:
- ../../../base

namePrefix: prod-client-a-

namespace: client-a-prod

commonLabels:
  client: client-a
  environment: prod

replicas:
- name: app
  count: 5

resources:
- network-policy.yaml

patchesStrategicMerge:
- deployment-patch.yaml

configMapGenerator:
- name: client-config
  literals:
  - CLIENT_ID=client-a
  - TENANT=client-a
  - API_ENDPOINT=https://api.client-a.example.com
  - LOG_LEVEL=WARN
