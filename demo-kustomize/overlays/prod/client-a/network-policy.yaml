apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: client-a-network-policy
spec:
  podSelector:
    matchLabels:
      client: client-a
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8080
  egress:
  # Production database
  - to:
    - namespaceSelector:
        matchLabels:
          name: database-prod
    ports:
    - protocol: TCP
      port: 5432
  # Redis cache
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
  # Monitoring endpoints
  - to:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: 9090
  # DNS
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
    ports:
    - protocol: UDP
      port: 53
