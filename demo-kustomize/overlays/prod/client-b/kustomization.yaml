apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

bases:
- ../../../base

namePrefix: prod-client-b-

namespace: client-b-prod

commonLabels:
  client: client-b
  environment: prod

replicas:
- name: app
  count: 7

resources:
- network-policy.yaml

patchesStrategicMerge:
- deployment-patch.yaml

configMapGenerator:
- name: client-config
  literals:
  - CLIENT_ID=client-b
  - TENANT=client-b
  - API_ENDPOINT=https://api.client-b.example.com
  - LOG_LEVEL=ERROR
