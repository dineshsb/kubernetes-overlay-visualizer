apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: client-b-network-policy
spec:
  podSelector:
    matchLabels:
      client: client-b
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8080
  egress:
  # Production database
  - to:
    - namespaceSelector:
        matchLabels:
          name: database-prod
    ports:
    - protocol: TCP
      port: 5432
  # External API services
  - to:
    - namespaceSelector:
        matchLabels:
          name: external-apis
    ports:
    - protocol: TCP
      port: 443
  # Monitoring
  - to:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: 9090
  # DNS
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
    ports:
    - protocol: UDP
      port: 53
  # S3 and external services (Client B specific)
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443
